name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages. Runs on every push to
# main — whether you commit a change yourself or the daily data sync commits
# fresh filings — plus on demand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Don't cancel an in-flight deploy — let production
# finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # SPA fallback: Pages serves 404.html for unknown paths. Copying index.html
      # to it means deep links (e.g. /congress-trading-monitor/filer/x) boot the
      # same app and route client-side instead of 404-ing on refresh.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
